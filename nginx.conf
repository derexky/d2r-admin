server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS, re-resolved per request so a recreated d2r-service container is found again
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $api http://d2r-service:3001;
    proxy_pass $api;
    proxy_set_header Host $host;
    # "查屬性" and saving an alert wait on traderie
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
